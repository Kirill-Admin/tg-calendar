<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Calendar</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #d35400;
            --accent: #f39c12;
            --bg: #fff5e1;
            --text: #2c3e50;
            --panel-bg: rgba(255, 255, 255, 0.94);
        }

        body.theme-autumn { --primary: #d35400; --accent: #e67e22; --bg: #fdf6ec; --text: #3e2723; }
        body.theme-winter { --primary: #1976d2; --accent: #0288d1; --bg: #e3f2fd; --text: #0d47a1; }
        body.theme-summer { --primary: #2e7d32; --accent: #fbc02d; --bg: #f1f8e9; --text: #1b5e20; }
        body.theme-spring { --primary: #7b1fa2; --accent: #f06292; --bg: #fce4ec; --text: #4a148c; }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.6s ease, color 0.6s ease;
            position: relative;
        }

        /* ХОЛСТ ДЛЯ КРУТОГО ЛИСТОПАДА / СНЕГОПАДА */
        #effects-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* НОВОГОДНЯЯ ГИРЛЯНДА */
        .garland {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 26px;
            background: radial-gradient(circle, #ff1744 4px, transparent 5px),
                        radial-gradient(circle, #00e5ff 4px, transparent 5px),
                        radial-gradient(circle, #ffea00 4px, transparent 5px),
                        radial-gradient(circle, #00e676 4px, transparent 5px);
            background-size: 32px 24px;
            background-position: 0 0, 8px 6px, 16px 2px, 24px 8px;
            z-index: 100;
        }
        body.theme-winter .garland { display: block; animation: lights 1.2s infinite alternate; }
        @keyframes lights {
            0% { opacity: 0.4; filter: drop-shadow(0 0 3px red); }
            100% { opacity: 1; filter: drop-shadow(0 0 8px yellow); }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 540px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* ШАПКА */
        .header {
            text-align: center;
            padding: 22px 16px;
            border-radius: 24px;
            background: var(--panel-bg);
            border: 2px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            backdrop-filter: blur(10px);
            margin-bottom: 22px;
            transition: border-color 0.5s;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .header p { font-size: 13px; opacity: 0.85; font-weight: 500; }

        /* АДМИН-ПАНЕЛЬ (ПО УМОЛЧАНИЮ СКРЫТА) */
        .admin-panel {
            display: none;
            background: #1e272e;
            color: #fff;
            padding: 20px;
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.35);
            margin-bottom: 22px;
            border: 2px solid var(--accent);
        }
        .admin-badge {
            display: inline-block;
            background: var(--accent);
            color: #000;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .admin-panel label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            opacity: 0.8;
            margin-top: 10px;
        }
        .admin-panel select, .admin-panel input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #485460;
            background: #2f3542;
            color: #fff;
            font-size: 14px;
            margin-top: 6px;
            outline: none;
        }
        .btn-add {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 900;
            width: 100%;
            margin-top: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-add:active { transform: scale(0.98); }

        /* СЕТКА ДАТ */
        .date-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
        }
        .date-card {
            background: var(--panel-bg);
            border-radius: 18px;
            padding: 14px 6px;
            text-align: center;
            box-shadow: 0 6px 16px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .date-card:hover { transform: translateY(-3px); }
        .date-card.available {
            border-color: #27ae60;
            background: rgba(39, 174, 96, 0.12);
        }
        .date-card.booked {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.08);
            opacity: 0.65;
        }
        .date-num { font-size: 26px; font-weight: 900; }
        .date-month { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--accent); margin-top: 2px; }
        .date-status-lbl { font-size: 9px; font-weight: 900; margin-top: 6px; letter-spacing: 0.5px; }

        .empty-placeholder {
            text-align: center;
            padding: 40px 10px;
            font-size: 15px;
            opacity: 0.7;
            font-weight: 600;
        }

        .auth-hint {
            text-align: center;
            font-size: 11px;
            opacity: 0.5;
            margin-top: 30px;
        }
    </style>
</head>
<body class="theme-autumn">

    <div class="garland"></div>
    <canvas id="effects-canvas"></canvas>

    <div class="container">
        
        <!-- АДМИН-ПАНЕЛЬ: ОТКРЫВАЕТСЯ САМА ДЛЯ АДМИНА -->
        <div id="adminPanel" class="admin-panel">
            <span class="admin-badge">👑 Режим Администратора</span>
            
            <label>Сменить сезон и эффекты:</label>
            <select id="seasonSelect" onchange="changeSeasonInDb()">
                <option value="autumn">🍂 Осень (Реалистичный листопад)</option>
                <option value="winter">❄️ Зима (Снегопад и Гирлянда)</option>
                <option value="summer">☀️ Лето (Солнечные лучи и бабочки)</option>
                <option value="spring">🌸 Весна (Лепестки сакуры)</option>
            </select>

            <label>Добавить дату в расписание:</label>
            <input type="date" id="newDateInput">
            <button class="btn-add" onclick="addDateToDb()">+ Опубликовать дату</button>
        </div>

        <!-- КЛИЕНТСКАЯ ШАПКА -->
        <div class="header">
            <h1 id="headerTitle">🍂 Осенняя Запись</h1>
            <p>Выберите свободную дату для бронирования</p>
        </div>

        <!-- СПИСОК ДАТ -->
        <div class="date-grid" id="dateGrid"></div>
        <div id="emptyMsg" class="empty-placeholder">На ближайшее время свободных дат нет...</div>

        <div class="auth-hint" id="debugInfo"></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        // 1. НАСТРОЙКИ АДМИНА
        const ADMIN_ID = 6457238867; // Твой Telegram ID
        let isMaster = false;

        // ПРОВЕРКА: Либо через Telegram WebApp, либо через URL-параметр ?admin=6457238867 (для проверки с ПК)
        const tgUser = tg?.initDataUnsafe?.user;
        const urlParams = new URLSearchParams(window.location.search);
        const queryAdmin = urlParams.get('admin');

        if ((tgUser && tgUser.id === ADMIN_ID) || queryAdmin === String(ADMIN_ID)) {
            isMaster = true;
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('debugInfo').innerText = "Вход выполнен: Администратор";
        } else {
            isMaster = false;
            document.getElementById('debugInfo').innerText = "Режим клиента (Просмотр и запись)";
        }

        // 2. ИНИЦИАЛИЗАЦИЯ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDi9QEO-IUp4fnzDYiha7sbFeD4PcTqDqw",
            authDomain: "calendary-4adec.firebaseapp.com",
            databaseURL: "https://calendary-4adec-default-rtdb.firebaseio.com",
            projectId: "calendary-4adec",
            storageBucket: "calendary-4adec.firebasestorage.app",
            messagingSenderId: "895830423725",
            appId: "1:895830423725:web:028d05127ac12822b1ee24",
            measurementId: "G-S3CFNZKKX3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentSeason = 'autumn';
        let slotsList = {};

        // 3. СИНХРОНИЗАЦИЯ СЕЗОНА
        db.ref('settings/season').on('value', snap => {
            currentSeason = snap.val() || 'autumn';
            applySeasonUI(currentSeason);
            initParticles(); // Перезапускаем анимацию под новый сезон
        });

        function changeSeasonInDb() {
            const s = document.getElementById('seasonSelect').value;
            db.ref('settings/season').set(s);
        }

        function applySeasonUI(s) {
            document.body.className = 'theme-' + s;
            const titles = {
                autumn: '🍂 Осенняя Запись',
                winter: '🎄 Зимняя Запись',
                summer: '☀️ Летняя Запись',
                spring: '🌸 Весенняя Запись'
            };
            document.getElementById('headerTitle').innerText = titles[s] || 'Запись';
            document.getElementById('seasonSelect').value = s;
        }

        // 4. СИНХРОНИЗАЦИЯ ДАТ
        db.ref('slots').on('value', snap => {
            slotsList = snap.val() || {};
            cleanOldDates();
            renderDates();
        });

        function cleanOldDates() {
            if (!isMaster) return;
            const today = new Date().toISOString().split('T')[0];
            for (let key in slotsList) {
                if (slotsList[key].date < today) {
                    db.ref('slots/' + key).remove();
                }
            }
        }

        function renderDates() {
            const grid = document.getElementById('dateGrid');
            grid.innerHTML = '';

            const today = new Date().toISOString().split('T')[0];
            const sortedKeys = Object.keys(slotsList)
                .filter(k => slotsList[k].date >= today)
                .sort((a, b) => new Date(slotsList[a].date) - new Date(slotsList[b].date));

            if (sortedKeys.length === 0) {
                document.getElementById('emptyMsg').style.display = 'block';
            } else {
                document.getElementById('emptyMsg').style.display = 'none';
            }

            sortedKeys.forEach(key => {
                const item = slotsList[key];
                const d = new Date(item.date);

                const card = document.createElement('div');
                card.className = `date-card ${item.status === 'free' ? 'available' : 'booked'}`;
                card.innerHTML = `
                    <div class="date-num">${d.getDate()}</div>
                    <div class="date-month">${d.toLocaleString('ru', { month: 'short' })}</div>
                    <div class="date-status-lbl">${item.status === 'free' ? 'СВОБОДНО' : 'ЗАНЯТО'}</div>
                `;

                card.onclick = () => handleDateClick(key, item);
                grid.appendChild(card);
            });
        }

        function addDateToDb() {
            const dateVal = document.getElementById('newDateInput').value;
            if (!dateVal) return;

            const key = dateVal.replace(/-/g, '_');
            db.ref('slots/' + key).set({
                date: dateVal,
                status: 'free'
            }).then(() => {
                document.getElementById('newDateInput').value = '';
            });
        }

        function handleDateClick(key, item) {
            if (isMaster) {
                const act = confirm(`Дата: ${item.date}\nОК — Сменить статус (Свободно / Занято)\nОтмена — Удалить дату из календаря`);
                if (act) {
                    const newStatus = item.status === 'free' ? 'booked' : 'free';
                    db.ref('slots/' + key + '/status').set(newStatus);
                } else {
                    db.ref('slots/' + key).remove();
                }
            } else {
                if (item.status === 'free') {
                    const humanDate = new Date(item.date).toLocaleDateString('ru');
                    if (tg?.MainButton) {
                        tg.MainButton.setText(`Записаться на ${humanDate}`);
                        tg.MainButton.show();
                        tg.MainButton.onClick(() => {
                            tg.sendData(JSON.stringify({ date: item.date }));
                            tg.close();
                        });
                    } else {
                        alert(`Вы выбрали свободную дату: ${humanDate}`);
                    }
                } else {
                    alert("Эта дата уже занята. Выберите другую свободную дату.");
                }
            }
        }

        // ==========================================
        // 5. КРУТОЙ ДИНАМИЧЕСКИЙ CANVAS С ЭФФЕКТАМИ
        // ==========================================
        const canvas = document.getElementById('effects-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const PARTICLE_SYMBOLS = {
            autumn: ['🍂', '🍁', '🍃'],
            winter: ['❄️', '❅', '✨'],
            summer: ['☀️', '🌻', '🦋'],
            spring: ['🌸', '🌺', '🌱']
        };

        function initParticles() {
            particles = [];
            const count = window.innerWidth < 600 ? 25 : 45;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 16 + 14,
                    speedY: Math.random() * 1.5 + 0.8,
                    speedX: Math.random() * 1 - 0.5,
                    angle: Math.random() * 360,
                    angleSpeed: (Math.random() - 0.5) * 2,
                    char: PARTICLE_SYMBOLS[currentSeason][Math.floor(Math.random() * 3)]
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.save();
                ctx.font = `${p.size}px serif`;
                ctx.translate(p.x, p.y);
                ctx.rotate((p.angle * Math.PI) / 180);
                ctx.fillText(p.char, -p.size / 2, p.size / 2);
                ctx.restore();

                p.y += p.speedY;
                p.x += Math.sin(p.y / 30) * 0.8 + p.speedX;
                p.angle += p.angleSpeed;

                if (p.y > canvas.height + 20) {
                    p.y = -20;
                    p.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawParticles);
        }

        initParticles();
        drawParticles();
    </script>
</body>
</html>
