<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Осенняя Запись</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --autumn-orange: #d35400;
            --autumn-gold: #f39c12;
            --autumn-brown: #3e2723;
            --autumn-bg: #fff5e1;
            --text-main: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, var(--autumn-bg) 0%, #ffe0b2 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимация падающих листьев */
        .leaf {
            position: fixed;
            top: -20px;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 0;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        .container { position: relative; z-index: 10; }

        .header {
            text-align: center;
            margin-bottom: 25px;
            background: rgba(211, 84, 0, 0.1);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid var(--autumn-orange);
        }

        h1 { margin: 0; font-size: 22px; color: var(--autumn-brown); }

        .date-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
        }

        .date-card {
            background: white;
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: 0.3s;
            cursor: pointer;
        }

        .date-card.available { border-color: #27ae60; background: #f1fcf4; }
        .date-card.booked { border-color: #e74c3c; opacity: 0.7; }
        .date-card:active { transform: scale(0.95); }

        .date-num { font-size: 20px; font-weight: 900; color: var(--autumn-brown); }
        .date-month { font-size: 12px; text-transform: uppercase; color: var(--autumn-gold); }

        /* Админка */
        .admin-panel {
            background: var(--autumn-brown);
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .btn {
            background: var(--autumn-orange);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }

        input[type="date"] {
            width: 90%;
            padding: 8px;
            border-radius: 8px;
            border: none;
            margin-top: 5px;
        }

        .empty-msg {
            text-align: center;
            color: var(--autumn-orange);
            font-style: italic;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Блок админа (виден только владельцу) -->
        <div class="admin-panel" id="adminPanel">
            <div style="font-weight: bold; margin-bottom: 5px;">🛠 Панель Мастера</div>
            <label>Добавить дату для записи:</label>
            <input type="date" id="newDateInput">
            <button class="btn" onclick="addDate()">Опубликовать дату 🍂</button>
        </div>

        <div class="header">
            <h1>🍂 Осенняя Запись</h1>
            <div style="font-size: 13px;">Выберите свободное число для бронирования</div>
        </div>

        <div class="date-grid" id="dateGrid">
            <!-- Сюда скрипт подставит даты -->
        </div>

        <div id="emptyMsg" class="empty-msg hidden">На ближайшее время свободных дат нет...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. ВПИШИ СЮДА СВОЙ ID И ID ЗАКАЗЧИКА
        const ADMIN_IDS = [123456789, 987654321]; 

        const userId = tg.initDataUnsafe?.user?.id;
        const isAdmin = ADMIN_IDS.includes(userId);

        if (isAdmin) document.getElementById('adminPanel').style.display = 'block';

        // 2. БАЗА ДАННЫХ (Для бесплатности используем Firebase или LocalStorage для теста)
        // В продакшне лучше подключить Firebase за 5 минут.
        let bookingData = JSON.parse(localStorage.getItem('autumn_slots')) || [];

        function renderDates() {
            const grid = document.getElementById('dateGrid');
            grid.innerHTML = '';
            const now = new Date();
            now.setHours(0,0,0,0); // Чтобы сравнивать только даты

            // Сортируем по дате
            bookingData.sort((a, b) => new Date(a.date) - new Date(b.date));

            // Авто-удаление старых дат и фильтрация
            bookingData = bookingData.filter(slot => {
                const slotDate = new Date(slot.date);
                return slotDate >= now; // Оставляем только сегодня и будущее
            });
            localStorage.setItem('autumn_slots', JSON.stringify(bookingData));

            if (bookingData.length === 0) {
                document.getElementById('emptyMsg').classList.remove('hidden');
            } else {
                document.getElementById('emptyMsg').classList.add('hidden');
            }

            bookingData.forEach((slot, index) => {
                const d = new Date(slot.date);
                const day = d.getDate();
                const month = d.toLocaleString('ru', { month: 'short' });

                const card = document.createElement('div');
                card.className = `date-card ${slot.status === 'free' ? 'available' : 'booked'}`;
                card.innerHTML = `
                    <div class="date-num">${day}</div>
                    <div class="date-month">${month}</div>
                    <div style="font-size:10px; margin-top:5px;">${slot.status === 'free' ? 'СВОБОДНО' : 'ЗАНЯТО'}</div>
                `;

                card.onclick = () => handleCardClick(index);
                grid.appendChild(card);
            });
        }

        function addDate() {
            const input = document.getElementById('newDateInput');
            if (!input.value) return;

            bookingData.push({ date: input.value, status: 'free' });
            localStorage.setItem('autumn_slots', JSON.stringify(bookingData));
            input.value = '';
            renderDates();
        }

        function handleCardClick(index) {
            const slot = bookingData[index];

            if (isAdmin) {
                // Админ меняет статус или удаляет
                const action = confirm("Изменить статус (ОК) или Удалить дату (Отмена)?");
                if (action) {
                    slot.status = slot.status === 'free' ? 'booked' : 'free';
                } else {
                    bookingData.splice(index, 1);
                }
                localStorage.setItem('autumn_slots', JSON.stringify(bookingData));
                renderDates();
            } else {
                // Клиент записывается
                if (slot.status === 'free') {
                    const d = new Date(slot.date).toLocaleDateString('ru');
                    tg.MainButton.setText(`Записаться на ${d}`);
                    tg.MainButton.show();
                    tg.MainButton.onClick(() => {
                        tg.sendData(JSON.stringify({ date: d, type: 'booking' }));
                        tg.close();
                    });
                } else {
                    tg.MainButton.hide();
                    alert("Эта дата уже занята.");
                }
            }
        }

        // Создание эффекта листьев
        function createLeaf() {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.innerText = ['🍂', '🍁', '🍃'][Math.floor(Math.random()*3)];
            leaf.style.left = Math.random() * 100 + 'vw';
            leaf.style.animationDuration = Math.random() * 3 + 2 + 's';
            leaf.style.opacity = Math.random();
            document.body.appendChild(leaf);
            setTimeout(() => leaf.remove(), 5000);
        }

        setInterval(createLeaf, 1000);
        renderDates();
    </script>
</body>
</html>
